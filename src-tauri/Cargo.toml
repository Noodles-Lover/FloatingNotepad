[package]
name = "floating-notepad"
version = "0.1.0"
description = "Floating notepad with an edge-docked ball"
authors = ["you"]
edition = "2021"

# The library is what Tauri runs; the binary just calls it.
[lib]
name = "floating_notepad_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
raw-window-handle = "0.6"
windows = { version = "0.58", features = [
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_Foundation",
] }
tauri-plugin-updater = "2.11.0"
tauri-plugin-process = "2.3.1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
