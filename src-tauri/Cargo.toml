[package]
name = "floating-notepad"
version = "0.1.0"
description = "Floating notepad with an edge-docked ball"
authors = ["you"]
edition = "2021"

# The library is what Tauri runs; the binary just calls it.
[lib]
name = "floating_notepad_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
raw-window-handle = "0.6"
windows = { version = "0.58", features = [
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_System_Threading",
  "Win32_System_SystemInformation",
  "Win32_UI_Shell",
  # 系统通知要求调用方的 AppUserModelID 在开始菜单里有快捷方式，
  # 未安装时得自己写一个 .lnk（IShellLink + IPropertyStore）。
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_Graphics_Gdi",
] }
tauri-plugin-updater = "2.11.0"
tauri-plugin-process = "2.3.1"
# 任务提醒走系统通知：全屏/游戏时是否打扰用户交给系统判断，比自己画弹窗稳妥。
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
