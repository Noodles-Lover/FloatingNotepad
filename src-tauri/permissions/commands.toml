# Explicit permission definitions for the app's own #[tauri::command]s.
# Tauri v2 does NOT auto-generate these for the main app, so we define them
# here (TOML only — JSON is not allowed for app-level permission files).
# The capability file references these identifiers WITHOUT a plugin prefix.
#
# IMPORTANT: the command name in `commands.allow` MUST match the Rust
# function name exactly (snake_case), because that is the name Tauri v2
# registers for the IPC. The frontend `invoke(...)` must use the same name.

[[permission]]
identifier = "allow-start-mouse-watch"
description = "Allow starting the global cursor watcher that drives the floating-ball reveal."
commands.allow = ["start_mouse_watch"]

[[permission]]
identifier = "allow-load-note"
description = "Allow loading the single note document from the local SQLite database."
commands.allow = ["load_note"]

[[permission]]
identifier = "allow-save-note"
description = "Allow saving (insert/update) the note document in the local SQLite database."
commands.allow = ["save_note"]

[[permission]]
identifier = "allow-list-skins"
description = "Allow listing the skin (material pack) folders under public/skin."
commands.allow = ["list_skins"]
