# Explicit permission definitions for the app's own #[tauri::command]s.
# Tauri v2 does NOT auto-generate these for the main app, so we define them
# here (TOML only — JSON is not allowed for app-level permission files).
# The capability file references these identifiers WITHOUT a plugin prefix.
#
# IMPORTANT: the command name in `commands.allow` MUST match the Rust
# function name exactly (snake_case), because that is the name Tauri v2
# registers for the IPC. The frontend `invoke(...)` must use the same name.

[[permission]]
identifier = "allow-start-mouse-watch"
description = "Allow starting the global cursor watcher that drives the floating-ball reveal."
commands.allow = ["start_mouse_watch"]

[[permission]]
identifier = "allow-load-tabs"
description = "Allow loading all scratch tabs and the active tab id from the local SQLite database."
commands.allow = ["load_tabs"]

[[permission]]
identifier = "allow-save-tabs"
description = "Allow saving (replace) all scratch tabs in the local SQLite database."
commands.allow = ["save_tabs"]

[[permission]]
identifier = "allow-set-active-tab"
description = "Allow persisting the currently active scratch tab id."
commands.allow = ["set_active_tab"]

[[permission]]
identifier = "allow-load-categories"
description = "Allow loading all todo categories and the active category id from the local SQLite database."
commands.allow = ["load_categories"]

[[permission]]
identifier = "allow-save-categories"
description = "Allow saving (replace) all todo categories in the local SQLite database."
commands.allow = ["save_categories"]

[[permission]]
identifier = "allow-set-active-category"
description = "Allow persisting the currently active todo category id."
commands.allow = ["set_active_category"]

[[permission]]
identifier = "allow-open-data-dir"
description = "Allow revealing the app data directory in the file manager, for backup and migration."
commands.allow = ["open_data_dir"]

[[permission]]
identifier = "allow-list-skins"
description = "Allow listing the skin (material pack) folders under public/skin."
commands.allow = ["list_skins"]

[[permission]]
identifier = "allow-toggle-passthrough"
description = "Allow toggling mouse passthrough (WS_EX_TRANSPARENT) from tray or widget menu. Rust is the single source of truth for this state."
commands.allow = ["toggle_passthrough"]

[[permission]]
identifier = "allow-show-lock-window"
description = "Allow showing the passthrough unlock lock window at a given position."
commands.allow = ["show_lock_window"]

[[permission]]
identifier = "allow-hide-lock-window"
description = "Allow hiding the passthrough unlock lock window."
commands.allow = ["hide_lock_window"]

[[permission]]
identifier = "allow-quit-app"
description = "Allow quitting the app from the widget context menu, sharing the tray's exit path."
commands.allow = ["quit_app"]

[[permission]]
identifier = "allow-set-lock-hide-delay"
description = "Allow syncing the auto-collapse delay used by the passthrough unlock lock."
commands.allow = ["set_lock_hide_delay"]
