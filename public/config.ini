# 浮动便签出厂配置（INI 格式）
# widgetSize   : 悬浮挂件尺寸（逻辑像素，24~200）
# windowWidth  : 笔记面板宽度（逻辑像素，240~900）
# windowHeight : 笔记面板高度（逻辑像素，200~900）
# autoCloseDelay: 鼠标离开 UI 多久后自动收起（毫秒，0~5000）
# idleOpacity  : 闲置（隐藏态）时悬浮挂件的不透明度（0.1~1）

widgetSize = 80
windowWidth = 400
windowHeight = 460
autoCloseDelay = 500
idleOpacity = 0.6
